# Front de test : tests/front + data/api (/api) + data/reference (/reference)
server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    # liste explicite : un bloc `types` remplace entièrement les types par défaut
    types {
        text/html                   html;
        text/css                    css;
        application/javascript      js;
        application/json            json;
        application/geo+json        geojson;
        text/csv                    csv;
        application/vnd.apache.parquet parquet;
        image/tiff                  tif;
        image/png                   png;
        image/svg+xml               svg;
        text/markdown               md;
    }
    gzip on;
    gzip_types application/json application/geo+json text/csv application/javascript text/css;
    add_header Cache-Control "no-cache" always;

    location /api/ {
        alias /data/api/;
        autoindex on;
        autoindex_format json;
    }
    location /reference/ {
        alias /data/reference/;
        autoindex on;
        autoindex_format json;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
