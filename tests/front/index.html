<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGBÉA — Explorateur de données</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>AGBÉA CLIMAT</strong>
      <span class="tag">front de test — données</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="explorer" role="tab">Explorateur</button>
      <button class="tab" data-tab="catalog" role="tab">Catalogue &amp; provenance</button>
      <button class="tab" data-tab="checks" role="tab">Contrôles</button>
      <button class="tab" data-tab="files" role="tab">Fichiers</button>
    </nav>
    <div class="meta" id="meta">chargement…</div>
  </header>

  <!-- ============================================================ EXPLORATEUR -->
  <main id="tab-explorer" class="tab-page explorer">
    <aside class="controls">
      <section>
        <h3>Contours (MAP TOGO / geodata.gouv.tg)</h3>
        <label><input type="checkbox" id="lyr-country" checked> Pays</label>
        <label><input type="checkbox" id="lyr-regions" checked> Régions (5)</label>
        <label><input type="checkbox" id="lyr-prefectures" checked> Préfectures (39)</label>
        <label><input type="checkbox" id="lyr-sites" checked> Sites pilotes (7)</label>
        <label>Fond
          <select id="basemap">
            <option value="osm">Plan (OSM)</option>
            <option value="sat">Satellite (Esri)</option>
            <option value="none">Aucun</option>
          </select>
        </label>
      </section>

      <section>
        <h3>Carte thématique (par unité)</h3>
        <label>Niveau
          <select id="ch-level">
            <option value="">— aucune —</option>
            <option value="region">Régions</option>
            <option value="prefecture" selected>Préfectures</option>
          </select>
        </label>
        <label>Indicateur <select id="ch-ind"></select></label>
        <label>Statistique
          <select id="ch-stat">
            <option value="mean">Moyenne annuelle (référence)</option>
            <option value="last">Dernière année complète</option>
            <option value="anom">Anomalie de la dernière année</option>
            <option value="trend">Tendance / décennie (annuel)</option>
          </select>
        </label>
        <div id="ch-legend" class="legend"></div>
      </section>

      <section>
        <h3>Couche raster (pixels)</h3>
        <label>Indicateur
          <select id="r-ind">
            <option value="">— aucune —</option>
          </select>
        </label>
        <label>Type
          <select id="r-kind">
            <option value="year">Année</option>
            <option value="baseline">Moyenne de référence</option>
            <option value="anomaly">Anomalie (dernière année)</option>
          </select>
        </label>
        <label>Année <span id="r-year-val"></span>
          <input type="range" id="r-year" min="0" max="0" value="0">
        </label>
        <label>Opacité <input type="range" id="r-opacity" min="0" max="100" value="75"></label>
        <div id="r-legend" class="legend"></div>
        <p class="hint" id="r-status"></p>
      </section>
      <p class="hint">Clique une région, une préfecture ou un site pour voir toutes ses données.
        <button class="link" id="btn-country">Voir le pays entier</button></p>
    </aside>

    <div class="map-wrap"><div id="map"></div></div>

    <section class="panel" id="panel">
      <div class="empty">Aucune unité sélectionnée.</div>
    </section>
  </main>

  <!-- ============================================================ CATALOGUE -->
  <main id="tab-catalog" class="tab-page doc" hidden></main>
  <!-- ============================================================ CONTRÔLES -->
  <main id="tab-checks" class="tab-page doc" hidden></main>
  <!-- ============================================================ FICHIERS -->
  <main id="tab-files" class="tab-page doc" hidden></main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script src="app.js"></script>
</body>
</html>
