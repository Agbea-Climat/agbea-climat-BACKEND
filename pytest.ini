[pytest]
addopts = -q -rs
testpaths = tests
pythonpath = .
markers =
    p1: prérequis structure
    p2: prérequis données
    p3: prérequis corpus RAG
    m01: GET /health
    m02: GET /meta
    m03: POST /sessions
    m04: GET /sessions/{id}
    m05: PATCH /sessions/{id}/preferences
    m06: GET /regions
    m07: GET /regions/geojson
    m08: GET /regions/{id}
    m09: GET /locate
    m10: GET /indicators
    m11: GET /datasets
    m12: GET /datasets/{id}
    m13: GET /layers
    m14: GET /regions/{id}/summary
    m15: GET /regions/{id}/timeseries
    m16: GET /regions/{id}/compare
    m17: GET /regions/{id}/timeseries/export
    m18: GET /layers/{id}/before-after
    m19: GET /dashboard
    m20: GET /regions/{id}/agriculture
    m21: POST /voice/transcribe
    m22: POST /admin/rag/ingest
    m23: GET /admin/rag/documents
    m24: POST /explain
    m25: POST /chat/stream
    m26: POST /chat
    m27: GET /profiles
    llm: appelle le LLM (exige LLM_API_KEY)
    real_data: exige data/processed/ (prérequis P2)
    db: exige PostgreSQL + pgvector (docker compose up -d db)
